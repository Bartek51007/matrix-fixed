name: Build Watch Face APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle :watchface:assembleDebug --no-daemon --stacktrace

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MatrixRain-GalaxyWatch7-apk
          path: watchface/build/outputs/apk/debug/*.apk
          if-no-files-found: error
